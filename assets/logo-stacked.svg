<?xml version="1.0" encoding="UTF-8"?>
<!-- Lapify Stacked Logo — L-Mark above Wordmark (Full Color) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 132 132" role="img" aria-labelledby="stackedTitle stackedDesc">
  <title id="stackedTitle">Lapify</title>
  <desc id="stackedDesc">Lapify stacked logo: L-Mark icon above wordmark</desc>

  <!-- ===== Icon: The L-Mark ===== -->
  <g transform="translate(34, 12)">
    <rect x="4" y="4" width="60" height="40" rx="9" fill="#2563EB"/>
    <!-- Screen "L" monogram -->
    <rect x="13" y="11" width="9" height="21" rx="2.5" fill="#FFFFFF"/>
    <rect x="13" y="26" width="26" height="9" rx="2.5" fill="#FFFFFF"/>
    <!-- Connectivity trace -->
    <path d="M44 12h7" stroke="#06B6D4" stroke-width="3" stroke-linecap="round"/>
    <!-- Connectivity node -->
    <circle cx="55" cy="12" r="4.2" fill="#06B6D4"/>
    <!-- Base line -->
    <path d="M5 60h58" stroke="#111827" stroke-width="5.5" stroke-linecap="round"/>
    <!-- Base network node -->
    <circle cx="34" cy="60" r="3.6" fill="#06B6D4"/>
  </g>

  <!-- ===== Wordmark ===== -->
  <text x="66" y="112" text-anchor="middle" font-family="'Inter','Poppins','Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif" font-size="34" font-weight="700" letter-spacing="-1" fill="#111827">
    <tspan fill="#2563EB">L</tspan>apify
  </text>
</svg>