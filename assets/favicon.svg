<?xml version="1.0" encoding="UTF-8"?>
<!-- Lapify Square Favicon — L-Mark on Royal Blue (Full Color) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="faviconTitle faviconDesc">
  <title id="faviconTitle">Lapify favicon</title>
  <desc id="faviconDesc">Lapify square favicon: L-Mark symbol on Royal Blue background</desc>

  <!-- Rounded square background -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#2563EB"/>

  <!-- Screen "L" monogram -->
  <rect x="14" y="14" width="7" height="17" rx="2" fill="#FFFFFF"/>
  <rect x="14" y="27" width="21" height="7" rx="2" fill="#FFFFFF"/>
  <!-- Connectivity trace -->
  <path d="M35 16h5" stroke="#06B6D4" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Connectivity node -->
  <circle cx="43" cy="16" r="3.2" fill="#06B6D4"/>
  <!-- Base line inside rounded square -->
  <path d="M16 42h32" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
  <!-- Base network node -->
  <circle cx="32" cy="42" r="2.6" fill="#06B6D4"/>
</svg>