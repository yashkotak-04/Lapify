<?xml version="1.0" encoding="UTF-8"?>
<!-- Lapify Horizontal Logo — Grayscale -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 64" role="img" aria-labelledby="grayTitle grayDesc">
  <title id="grayTitle">Lapify — Grayscale</title>
  <desc id="grayDesc">Lapify horizontal logo in grayscale for grayscale printing</desc>

  <!-- ===== Icon: The L-Mark (grayscale) ===== -->
  <g transform="translate(40, 8) scale(0.82)">
    <rect x="8" y="8" width="48" height="32" rx="7" fill="#475569"/>
    <!-- Screen "L" monogram (negative space) -->
    <rect x="15" y="14" width="7" height="17" rx="2" fill="#FFFFFF"/>
    <rect x="15" y="27" width="21" height="7" rx="2" fill="#FFFFFF"/>
    <!-- Connectivity trace -->
    <path d="M37 16h6" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Connectivity node -->
    <circle cx="46" cy="16" r="3.5" fill="#94A3B8"/>
    <!-- Base line -->
    <path d="M10 48h44" stroke="#334155" stroke-width="4.5" stroke-linecap="round"/>
    <!-- Base network node -->
    <circle cx="32" cy="48" r="3" fill="#64748B"/>
  </g>

  <!-- ===== Wordmark ===== -->
  <text x="104" y="44" font-family="'Inter','Poppins','Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif" font-size="36" font-weight="700" letter-spacing="-1" fill="#334155">Lapify</text>
</svg>