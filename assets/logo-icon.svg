<?xml version="1.0" encoding="UTF-8"?>
<!-- Lapify Standalone Icon — The L-Mark (Full Color, Transparent) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="iconTitle iconDesc">
  <title id="iconTitle">Lapify icon</title>
  <desc id="iconDesc">Lapify L-Mark: laptop lid with L monogram and connectivity node</desc>

  <!-- Laptop lid -->
  <rect x="8" y="8" width="48" height="32" rx="8" fill="#2563EB"/>
  <!-- Screen "L" monogram -->
  <rect x="16" y="14" width="7" height="17" rx="2" fill="#FFFFFF"/>
  <rect x="16" y="27" width="21" height="7" rx="2" fill="#FFFFFF"/>
  <!-- Connectivity trace -->
  <path d="M37 16h6" stroke="#06B6D4" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Connectivity node -->
  <circle cx="46" cy="16" r="3.5" fill="#06B6D4"/>
  <!-- Base line -->
  <path d="M10 48h44" stroke="#111827" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Base network node -->
  <circle cx="32" cy="48" r="3" fill="#06B6D4"/>
</svg>