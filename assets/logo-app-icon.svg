<?xml version="1.0" encoding="UTF-8"?>
<!-- Lapify Circular App Icon — Solid Royal Blue with L-Mark (Full Color) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" role="img" aria-labelledby="appIconTitle appIconDesc">
  <title id="appIconTitle">Lapify app icon</title>
  <desc id="appIconDesc">Lapify circular app icon with L-Mark symbol in Royal Blue</desc>

  <!-- Circular background -->
  <circle cx="96" cy="96" r="96" fill="#2563EB"/>

  <!-- Laptop lid -->
  <rect x="46" y="46" width="100" height="62" rx="14" fill="#FFFFFF"/>
  <!-- Screen "L" monogram (royal blue) -->
  <rect x="62" y="58" width="14" height="34" rx="4" fill="#2563EB"/>
  <rect x="62" y="82" width="42" height="14" rx="4" fill="#2563EB"/>
  <!-- Connectivity trace -->
  <path d="M76 56h16" stroke="#06B6D4" stroke-width="5" stroke-linecap="round"/>
  <!-- Connectivity node -->
  <circle cx="112" cy="56" r="8" fill="#06B6D4"/>
  <!-- Base line -->
  <path d="M52 120h88" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round"/>
  <!-- Base network node -->
  <circle cx="96" cy="120" r="6" fill="#06B6D4"/>
</svg>